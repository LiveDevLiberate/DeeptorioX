name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Lint (type-aware)
        run: npm run lint

      - name: Node tests
        run: npm run test:node

      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/coverage-gate.mjs

      - name: Python client tests
        run: npm run test:python

      - name: Browser UI regression
        if: matrix.os == 'windows-latest'
        run: npm run test:ui
        env:
          AUTORIO_UI_REQUIRED: "1"

      - name: Repository hygiene
        run: npm run check:repo

      - name: Formatting
        run: npm run format:check
