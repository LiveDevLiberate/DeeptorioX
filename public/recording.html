<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent transcript</title><link rel="stylesheet" href="/runs.css"></head><body class="recording">
<svg class="icon-sprite" aria-hidden="true">
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2h5c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a5 5 0 0 0-6.9 5.4L3 16.5V21h4.5l4.8-4.8a5 5 0 0 0 5.4-6.9l-3 3-2.5-2.5 2.5-3z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3z"/><path d="M12 9v6"/><path d="M12 18h.01"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M16 8l-2.5 5.5L8 16l2.5-5.5L16 8z"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 4h10l-2 4 2 4H6"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 4v15"/><path d="M6 13l6 6 6-6"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4"/><path d="M10 6l-6 6 6 6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6l-5.5 8.5A2 2 0 0 0 6 21h12a2 2 0 0 0 1.5-3.5L14 9V3"/><path d="M8 15h8"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-hammer" viewBox="0 0 24 24"><path d="M14 4l6 6-3 3-6-6 3-3z"/><path d="M11 9 4 16v4h4l7-7"/></symbol>
  <symbol id="i-pickaxe" viewBox="0 0 24 24"><path d="M4 21 15 10"/><path d="M13 3l8 8-2 2-8-8 2-2z"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></symbol>
  <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 11h6M9 15h4"/></symbol>
  <symbol id="i-rocket" viewBox="0 0 24 24"><path d="M5 15c-1 3-1 5-1 5s2 0 5-1"/><path d="M9 18l-3-3"/><path d="M14 4c3 0 6 3 6 6l-7 7-4-4 5-9z"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h7"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/><path d="M7 7h.01M7 16h.01"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></symbol>
</svg>
<div id="agentStatus">
  <div class="status-inner">
    <div class="status-line"><span id="statusState" class="status-badge">loading</span><span id="statusActivity" class="status-activity">—</span><span id="statusMeta" class="status-meta"></span><button id="statusToggle" class="status-toggle" type="button" aria-label="Toggle status details">▾</button></div>
    <div id="statusCurrent" class="status-current">—</div>
    <div id="statusDone" class="status-done"></div>
    <div id="statusMetrics" class="status-metrics"></div>
    <div id="statusScores" class="status-scores"></div>
  </div>
</div>
<div id="transcriptTools" class="transcript-tools">
  <button id="filterAll" class="chip active" type="button"><svg class="icon"><use href="#i-layers"/></svg>All</button>
  <button id="filterThinking" class="chip" type="button"><svg class="icon"><use href="#i-bulb"/></svg>Thinking</button>
  <button id="filterActions" class="chip" type="button"><svg class="icon"><use href="#i-wrench"/></svg>Actions</button>
  <button id="filterMessages" class="chip" type="button"><svg class="icon"><use href="#i-chat"/></svg>Messages</button>
  <button id="filterErrors" class="chip" type="button"><svg class="icon"><use href="#i-alert"/></svg>Errors</button>
  <button id="filterDecisions" class="chip" type="button"><svg class="icon"><use href="#i-compass"/></svg>Decisions</button>
  <input id="transcriptSearch" type="search" placeholder="Filter…" autocomplete="off" aria-label="Filter transcript text">
</div>
<div id="codexOutput" aria-label="Agent output" tabindex="0"></div><script type="module" src="/recording.js"></script></body></html>
