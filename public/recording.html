<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent transcript</title><script>try{const p=new URLSearchParams(location.search);const q=p.get("theme");const s=localStorage.getItem("autorio.theme");const t=(q==="light"||q==="dark")?q:s;if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script><link rel="stylesheet" href="/runs.css"></head>
<body class="recording">
<div id="agentStatus">
  <div class="status-inner ui-grid-12">
    <header class="status-head" aria-label="Run status">
      <div class="status-line"><button id="statusToggle" class="status-toggle" type="button" aria-label="Toggle status details" aria-expanded="true"><span class="status-toggle-label">Stats</span></button><button id="mapInfoToggle" class="status-map-toggle" type="button" aria-label="Map settings" aria-expanded="false" aria-controls="mapInfoOverlay"><span class="icon icon-map" aria-hidden="true"></span><span class="status-map-label">Map</span></button><button id="themeToggle" class="status-theme-toggle" type="button" aria-label="Switch to light theme" aria-pressed="false"><span class="icon icon-sun" aria-hidden="true"></span><span class="status-theme-label">Light</span></button><span id="statusState" class="status-badge">…</span><span id="statusActivity" class="status-activity">—</span><span id="stateTimer" class="state-timer" hidden></span><span id="statusMeta" class="status-meta"></span></div>
    </header>
    <section id="planPanel" class="status-plan ui-col-1-7" aria-label="Current plan">
      <div id="statusCurrent" class="status-current" hidden></div>
      <div id="statusDone" class="status-done"></div>
    </section>
    <section id="telemetryPanel" class="status-telemetry ui-col-8-12" aria-label="Live telemetry">
      <div class="status-data">
        <div id="statusMetrics" class="status-metrics"></div>
        <div id="statusScores" class="status-scores"></div>
      </div>
    </section>
  </div>
</div>
<main class="transcript-pane">
  <div id="transcriptTools" class="transcript-tools" role="toolbar" aria-label="Transcript filters">
    <div id="filterGroup" class="filter-group" role="group" aria-label="Filter by category">
      <button id="filterAll" class="chip active" type="button"><span class="icon icon-layers"></span>All</button>
      <button id="filterThinking" class="chip" type="button"><span class="icon icon-brain"></span>Thinking</button>
      <button id="filterActions" class="chip" type="button"><span class="icon icon-wrench"></span>Actions</button>
      <button id="filterMessages" class="chip" type="button"><span class="icon icon-chat"></span>Messages</button>
      <button id="filterErrors" class="chip" type="button"><span class="icon icon-siren"></span>Errors</button>
      <button id="filterDecisions" class="chip" type="button"><span class="icon icon-compass"></span>Decisions</button>
    </div>
    <label class="search-field">
      <span class="icon icon-search" aria-hidden="true"></span>
      <input id="transcriptSearch" type="search" placeholder="Filter…" autocomplete="off" aria-label="Filter transcript text">
    </label>
  </div>
  <div id="codexOutput" aria-label="Agent output" tabindex="0"></div>
</main>
<div id="mapInfoOverlay" class="map-info-overlay" hidden>
  <section id="mapInfoDialog" class="map-info-dialog" role="dialog" aria-modal="true" aria-labelledby="mapInfoTitle" aria-describedby="mapInfoNote">
    <header class="map-info-head">
      <h2 id="mapInfoTitle">Map settings</h2>
      <button id="mapInfoClose" class="map-info-close" type="button" aria-label="Close map settings">×</button>
    </header>
    <div id="mapInfoBody" class="map-info-body"></div>
    <p id="mapInfoNote" class="map-info-note">Seed and autoplace overrides used to generate the benchmark map. Only overrides are listed; unlisted resources and blank fields use Factorio defaults.</p>
  </section>
</div>
<script type="module" src="/recording.js"></script>
</body>
</html>
